name: Deploy AZML to Heroku

on:
  workflow_dispatch:
    inputs:
      HEROKU_APP_NAME:
        description: "Heroku App name"
        required: true
      HEROKU_EMAIL:
        description: "Heroku email address"
        required: true
      HEROKU_API_KEY:
        description: "Heroku API key"
        required: true
      BASE_URL:
        description: "Base URL (defaults to https://<app-name>.herokuapp.com)"
        required: false
        default: ""
      BOT_TOKEN:
        description: "Telegram bot token"
        required: true
      OWNER_ID:
        description: "Owner's telegram ID"
        required: true
      DATABASE_URL:
        description: "Database URL from MongoDB"
        required: true
      TELEGRAM_API:
        description: "Telegram API ID"
        required: true
      TELEGRAM_HASH:
        description: "Telegram HASH"
        required: true
      UPSTREAM_REPO:
        description: "Upstream Repository"
        required: false
        default: "https://github.com/aquib4040/AZML"
      UPSTREAM_BRANCH:
        description: "Upstream Branch"
        required: false
        default: "test-hk"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Deploy Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Heroku CLI
        run: |
          curl https://cli-assets.heroku.com/install.sh | sh

      - name: Configure Heroku and Deploy via Git Push
        env:
          HEROKU_API_KEY: ${{ inputs.HEROKU_API_KEY }}
          HEROKU_EMAIL: ${{ inputs.HEROKU_EMAIL }}
          APP_NAME: ${{ inputs.HEROKU_APP_NAME }}
        run: |
          echo "Setting up credentials in ~/.netrc..."
          cat << EOF > ~/.netrc
          machine api.heroku.com
            login $HEROKU_EMAIL
            password $HEROKU_API_KEY
          machine git.heroku.com
            login $HEROKU_EMAIL
            password $HEROKU_API_KEY
          EOF
          chmod 600 ~/.netrc

          echo "Verifying Heroku CLI authentication..."
          heroku auth:whoami

          echo "Setting Heroku stack to container..."
          heroku stack:set container -a "$APP_NAME"

          if [ -n "${{ inputs.BASE_URL }}" ]; then
            FINAL_BASE_URL="${{ inputs.BASE_URL }}"
          else
            FINAL_BASE_URL="https://${APP_NAME}.herokuapp.com"
          fi
          echo "Using BASE_URL: $FINAL_BASE_URL"

          echo "Setting Heroku Config Vars..."
          heroku config:set \
            BASE_URL="$FINAL_BASE_URL" \
            HEROKU_APP_NAME="$APP_NAME" \
            BOT_TOKEN="${{ inputs.BOT_TOKEN }}" \
            OWNER_ID="${{ inputs.OWNER_ID }}" \
            DATABASE_URL="${{ inputs.DATABASE_URL }}" \
            TELEGRAM_API="${{ inputs.TELEGRAM_API }}" \
            TELEGRAM_HASH="${{ inputs.TELEGRAM_HASH }}" \
            UPSTREAM_REPO="${{ inputs.UPSTREAM_REPO }}" \
            UPSTREAM_BRANCH="${{ inputs.UPSTREAM_BRANCH }}" \
            -a "$APP_NAME"

          echo "Deploying via Heroku Git Push (heroku.yml)..."
          git remote add heroku "https://git.heroku.com/$APP_NAME.git" || git remote set-url heroku "https://git.heroku.com/$APP_NAME.git"
          git push -f heroku main

          echo "Ensuring web dyno is running..."
          heroku ps:scale web=1 -a "$APP_NAME" || true

          echo "Deployment completed successfully!"
